# R-hub's generic GitHub Actions workflow file. It's canonical location is at
# https://github.com/r-hub/actions/blob/v1/workflows/rhub.yaml
# You can update this file to a newer version using the rhub2 package:
#
# rhub::rhub_setup()
#
# It is unlikely that you need to modify this file manually.

name: R-hub
run-name: "${{ github.event.inputs.id }}: ${{ github.event.inputs.name || format('Manually run by {0}', github.triggering_actor) }}"

on:
  workflow_dispatch:
    inputs:
      config:
        description: 'A comma separated list of R-hub platforms to use.'
        type: string
        default: 'linux,windows,macos'
      name:
        description: 'Run name. You can leave this empty now.'
        type: string
      id:
        description: 'Unique ID. You can leave this empty now.'
        type: string

jobs:

  setup:
    runs-on: ubuntu-latest
    outputs:
      containers: ${{ steps.rhub-setup.outputs.containers }}
      platforms: ${{ steps.rhub-setup.outputs.platforms }}

    steps:
    # NO NEED TO CHECKOUT HERE
    - uses: r-hub/actions/setup@v1
      with:
        config: ${{ github.event.inputs.config }}
      id: rhub-setup

  linux-containers:
    needs: setup
    if: ${{ needs.setup.outputs.containers != '[]' }}
    runs-on: ubuntu-latest
    name: ${{ matrix.config.label }}
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJson(needs.setup.outputs.containers) }}
    container:
      image: ${{ matrix.config.container }}
    env:
      RGL_USE_NULL: true

    steps:
      - uses: r-hub/actions/checkout@v1
      - uses: r-hub/actions/platform-info@v1
        with:
          token: ${{ secrets.RHUB_TOKEN }}
          job-config: ${{ matrix.config.job-config }}
      - name: Show R repositories
        run: |
          options(width = 1000)
          print(getOption("repos"))
        shell: Rscript {0}
      - name: Check CMake for native dependencies
        id: cmake
        shell: Rscript {0}
        run: |
          cmake = Sys.which("cmake")
          version = if (nzchar(cmake)) numeric_version(sub("^cmake version ", "", system2(cmake, "--version", stdout = TRUE)[1L])) else numeric_version("0")
          cat("install=", tolower(version < "3.24"), "\n", sep = "", file = Sys.getenv("GITHUB_OUTPUT"), append = TRUE)
      - uses: jwlawson/actions-setup-cmake@0d6a7d60b009d01c9e7523be22153ff8f19460d3 # v2
        if: steps.cmake.outputs.install == 'true'
        with:
          cmake-version: '3.31.10'
      - name: Add release dependencies to R-hub repositories
        shell: Rscript {0}
        run: |
          cat('\noptions(repos = c(getOption("repos"), rayverse = "https://tylermorganwall.r-universe.dev"))\n',
              file = path.expand("~/.Rprofile"), append = TRUE)
      - uses: r-hub/actions/setup-deps@v1
        with:
          token: ${{ secrets.RHUB_TOKEN }}
          job-config: ${{ matrix.config.job-config }}
          pak-version: stable
          extra-packages: any::rcmdcheck, rlas=?ignore, lidR=?ignore
      - uses: r-hub/actions/run-check@v1
        with:
          token: ${{ secrets.RHUB_TOKEN }}
          job-config: ${{ matrix.config.job-config }}

  other-platforms:
    needs: setup
    if: ${{ needs.setup.outputs.platforms != '[]' }}
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.label }}
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJson(needs.setup.outputs.platforms) }}
    env:
      RGL_USE_NULL: true

    steps:
      - uses: r-hub/actions/checkout@v1
      - uses: r-hub/actions/setup-r@v1
        with:
          job-config: ${{ matrix.config.job-config }}
          token: ${{ secrets.RHUB_TOKEN }}
      - uses: r-hub/actions/platform-info@v1
        with:
          token: ${{ secrets.RHUB_TOKEN }}
          job-config: ${{ matrix.config.job-config }}
      - name: Show R repositories
        run: |
          options(width = 1000)
          print(getOption("repos"))
        shell: Rscript {0}
      - name: Add release dependencies to R-hub repositories
        shell: Rscript {0}
        run: |
          cat('\noptions(repos = c(getOption("repos"), rayverse = "https://tylermorganwall.r-universe.dev"))\n',
              file = path.expand("~/.Rprofile"), append = TRUE)
      - uses: r-hub/actions/setup-deps@v1
        with:
          token: ${{ secrets.RHUB_TOKEN }}
          job-config: ${{ matrix.config.job-config }}
          pak-version: stable
          extra-packages: any::rcmdcheck, rlas=?ignore, lidR=?ignore
      - uses: r-hub/actions/run-check@v1
        with:
          job-config: ${{ matrix.config.job-config }}
          token: ${{ secrets.RHUB_TOKEN }}
