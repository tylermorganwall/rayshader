name: Build R source package

on:
  push:
    branches: ['**']
  pull_request:
    branches: [master, ggplot_data]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and verify source tarball
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      artifact-name: ${{ steps.artifact-name.outputs.name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Test safe publication behavior
        run: node --test .github/scripts/publish-source.test.cjs .github/scripts/test-source-build.cjs
      - name: Build the triggering commit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/source-build" "$RUNNER_TEMP/source-output"
          cd "$RUNNER_TEMP/source-build"
          R CMD build "$GITHUB_WORKSPACE"
      - name: Verify and label the source package
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob dotglob
          archives=("$RUNNER_TEMP/source-build/"*.tar.gz)
          [[ ${#archives[@]} == 1 ]] || { echo 'Expected exactly one source tarball' >&2; exit 1; }
          fields=$(Rscript --vanilla -e 'd <- read.dcf(commandArgs(TRUE)[1], fields = c("Package", "Version")); stopifnot(nrow(d) == 1L, !anyNA(d)); cat(d[1, ], sep = "\t")' "$GITHUB_WORKSPACE/DESCRIPTION")
          IFS=$'\t' read -r package version <<< "$fields"
          [[ $package =~ ^[A-Za-z][A-Za-z0-9.]*$ && $version =~ ^[0-9][A-Za-z0-9.+-]*$ ]] || { echo 'Unexpected package name or version' >&2; exit 1; }
          tar -xOzf "${archives[0]}" "$package/DESCRIPTION" > "$RUNNER_TEMP/source-build/DESCRIPTION"
          Rscript --vanilla -e 'a <- commandArgs(TRUE); f <- c("Package", "Version"); stopifnot(identical(read.dcf(a[1], fields = f), read.dcf(a[2], fields = f)))' "$GITHUB_WORKSPACE/DESCRIPTION" "$RUNNER_TEMP/source-build/DESCRIPTION"
          [[ $GITHUB_SHA =~ ^[0-9a-f]{40}$ ]] || { echo 'Unexpected commit SHA' >&2; exit 1; }
          [[ $GITHUB_RUN_ID =~ ^[1-9][0-9]*$ && $GITHUB_RUN_NUMBER =~ ^[1-9][0-9]*$ && $GITHUB_RUN_ATTEMPT =~ ^[1-9][0-9]*$ ]] || { echo 'Unexpected run metadata' >&2; exit 1; }
          branch_slug=$(printf '%s' "$GITHUB_REF_NAME" | LC_ALL=C.UTF-8 sed 's/[^A-Za-z0-9._-]/-/g' | cut -c1-60)
          branch_hash=$(printf '%s' "$GITHUB_REF_NAME" | sha256sum | cut -c1-12)
          filename="${package}_${version}_${branch_slug}-${branch_hash}_${GITHUB_SHA}_${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tar.gz"
          cp -- "${archives[0]}" "$RUNNER_TEMP/source-output/$filename"
          digest=$(sha256sum -- "$RUNNER_TEMP/source-output/$filename" | cut -d ' ' -f1)
          jq -n --arg package "$package" --arg version "$version" \
            --arg branch "$GITHUB_REF_NAME" --arg sha "$GITHUB_SHA" \
            --argjson run_id "$GITHUB_RUN_ID" --argjson run_number "$GITHUB_RUN_NUMBER" \
            --argjson run_attempt "$GITHUB_RUN_ATTEMPT" --arg filename "$filename" --arg sha256 "$digest" \
            '{package: $package, version: $version, branch: $branch, sha: $sha, run_id: $run_id, run_number: $run_number, run_attempt: $run_attempt, filename: $filename, sha256: $sha256}' \
            > "$RUNNER_TEMP/source-output/source-build.json"
          printf '%s  %s\n' "$digest" "$filename" > "$RUNNER_TEMP/source-output/$filename.sha256"
          cat "$RUNNER_TEMP/source-output/source-build.json"
      - name: Choose artifact name
        id: artifact-name
        shell: bash
        run: echo "name=r-source-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - name: Save verified source package
        id: artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact-name.outputs.name }}
          path: ${{ runner.temp }}/source-output/*
          if-no-files-found: error
          retention-days: 30
      - name: Download the saved package for verification
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.artifact-name.outputs.name }}
          path: ${{ runner.temp }}/source-download
      - name: Verify the downloaded tarball and metadata
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/source-download"
          cmp "$RUNNER_TEMP/source-output/source-build.json" source-build.json
          filename=$(jq -er '.filename' source-build.json)
          shopt -s nullglob dotglob
          archives=(*.tar.gz)
          checksums=(*.sha256)
          [[ ${#archives[@]} == 1 && ${#checksums[@]} == 1 ]] || { echo 'Expected exactly one tarball and checksum' >&2; exit 1; }
          [[ ${archives[0]} == "$filename" && ${checksums[0]} == "$filename.sha256" ]] || { echo 'Downloaded filenames do not match metadata' >&2; exit 1; }
          cmp "$RUNNER_TEMP/source-output/$filename.sha256" "$filename.sha256"
          sha256sum --check --strict -- "$filename.sha256"
      - name: Link the build artifact
        env:
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
        run: |
          printf '### Verified R source package\n\n[Download this build artifact](%s) (retained for 30 days).\n\nMaster-branch builds also publish a durable download in the publication job.\n' \
            "$ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish latest successful master source
    needs: build
    if: >-
      github.ref == 'refs/heads/master' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: source-release-master
      cancel-in-progress: false
    steps:
      # This job never runs R, package hooks, or pull-request code.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: .github/scripts
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact-name }}
          path: source-output
      - uses: actions/github-script@v7
        with:
          script: |
            const publishSource = require('./.github/scripts/publish-source.cjs');
            await publishSource({ github, context, core, directory: 'source-output' });
